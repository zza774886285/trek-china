name: Build & Verify

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build --workspace=shared

      - name: Build server
        run: npm run build --workspace=server

      - name: Build client
        run: npm run build --workspace=client

      - name: Verify artifacts exist
        run: |
          test -d shared/dist || (echo "shared/dist missing" && exit 1)
          test -d server/dist || (echo "server/dist missing" && exit 1)
          test -d client/dist || (echo "client/dist missing" && exit 1)
          echo "All build artifacts present ✓"

      - name: Package dist
        run: |
          tar czf trek-china-dist.tar.gz shared/dist/ server/dist/ server/package.json client/dist/ client/public/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trek-china-dist
          path: trek-china-dist.tar.gz
          retention-days: 3
